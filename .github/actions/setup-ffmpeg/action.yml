name: Set up FFmpeg
description: >
  Exports FFMPEG_DIR pointing at a pinned FFmpeg 8.0 development tree, built
  from vcpkg on a miss and restored from the Actions cache on a hit.

  Adapted from apps/reaction's action of the same name (a copy of the one in
  `hash1018/media-pp`), with one difference: the vcpkg triplet is an input
  rather than derived from runner.os, so the Intel macOS job can ask for
  x64-osx-dynamic where reaction's takes arm64-osx-dynamic from any Mac. What
  FFmpeg this repository builds against decides what an archive bundles and
  therefore what its licence obligations are, so this copy stays pinned here
  rather than reaching into the cloned reaction tree.

inputs:
  vcpkg-ref:
    description: >
      The microsoft/vcpkg tag to build the FFmpeg port from.

      ffmpeg-next 8.1 supports FFmpeg through 8.0, and the rolling vcpkg
      installation on hosted runners has moved past that. This tag's ffmpeg
      port is 8.0.1, the same version the vendored `media` in apps/reaction
      is developed against. An immutable git tag is the one reproducible
      source of a matching FFmpeg.
    required: false
    default: "2026.01.16"
  vcpkg-features:
    description: >
      Comma-separated vcpkg features to add to the default `ffmpeg` port
      install (e.g. "openh264").

      `openh264` is what reaction encodes H.264 with where no hardware
      encoder is available, so a build without it has no software fallback. It
      is also what keeps the bundled FFmpeg non-GPL — x264, the obvious
      alternative, is GPL, which would change the terms an archive is
      distributed under.

      `nvcodec` is NVIDIA's encode, decode and CUDA support; on Windows it is
      what the NVENC encoder setting means, and without it a recording falls
      back to Media Foundation. It adds only `ffnvcodec`, NVIDIA's
      MIT-licensed headers, which load the driver at run time. No NVIDIA
      anything exists on a Mac, so the macOS jobs leave it off.

      Additive to vcpkg's default feature set, not a replacement for it — the
      defaults are already free of GPL components.
    required: false
    default: "openh264"
  triplet:
    description: >
      The vcpkg triplet to install for: x64-windows, arm64-osx-dynamic or
      x64-osx-dynamic — all three this repository's overlays
      (.github/vcpkg-triplets), which pin the deployment target on macOS and
      build release only, so a cache miss costs one FFmpeg build rather than
      a release one and a debug one nothing links.
    required: true

runs:
  using: composite
  steps:
    # Building FFmpeg from source costs tens of minutes on a hosted runner.
    # What it produces depends only on the ref and triplet, so the installed
    # tree is cached under exactly those.
    #
    # No `restore-keys`: a prefix fallback would hand back a tree built for
    # another ref or triplet, which is the one outcome the pin exists to
    # prevent. A miss must rebuild rather than approximate.
    #
    # Split into restore + save (rather than the combined `actions/cache`
    # with `save-always`, now deprecated for never actually saving past a
    # later failed step): the save step sits inside this action's own steps,
    # before control returns to the caller, so it still runs even when the
    # caller's build fails.
    #
    # The key is made once, here, for both: a cache key may not contain a
    # comma, and a list of features is written with them.
    #
    # `PATCH` names what the install steps change from vcpkg's own build —
    # the osx triplets' deployment target, and the release-only build type
    # every triplet here sets — so a tree built without those changes is
    # never restored as one built with them.
    - name: Name the FFmpeg cache
      id: key
      shell: bash
      env:
        TRIPLET: ${{ inputs.triplet }}
        REF: ${{ inputs.vcpkg-ref }}
        FEATURES: ${{ inputs.vcpkg-features }}
        PATCH: ${{ runner.os == 'macOS' && '-macos13-release' || '-release' }}
      run: echo "key=vcpkg-ffmpeg-$TRIPLET-$REF-${FEATURES//,/-}$PATCH" >> "$GITHUB_OUTPUT"

    - name: Restore cached FFmpeg development libraries
      id: ffmpeg
      uses: actions/cache/restore@v4
      with:
        path: .vcpkg/installed
        key: ${{ steps.key.outputs.key }}

    - name: Check out compatible vcpkg
      if: steps.ffmpeg.outputs.cache-hit != 'true'
      uses: actions/checkout@v6
      with:
        repository: microsoft/vcpkg
        ref: ${{ inputs.vcpkg-ref }}
        path: .vcpkg

    # FFmpeg's `configure` finds OpenH264 through pkg-config; vcpkg fetches
    # the rest of what it builds with itself. `nasm` assembles OpenH264's x86
    # SIMD: the Intel runner image doesn't ship it, and the port's build
    # fails with "Could not find nasm" without it. Homebrew leaves pkgconf
    # as it is where the runner already has it.
    - name: Install vcpkg build dependencies (macOS)
      if: steps.ffmpeg.outputs.cache-hit != 'true' && runner.os == 'macOS'
      shell: bash
      run: brew install pkgconf nasm

    # The exit-code checks stop this step at the command that actually broke.
    # A native failure does not raise a PowerShell error, so without them the
    # script runs on and the step reports whichever command exited last.
    #
    # Through this repository's own overlay triplet — the x64-windows.cmake
    # there overrides vcpkg's built-in triplet of that name — so the build is
    # release only: nothing this repository builds links a debug FFmpeg, and
    # vcpkg would otherwise spend about half of a miss building one.
    - name: Install FFmpeg development libraries (Windows)
      if: steps.ffmpeg.outputs.cache-hit != 'true' && runner.os == 'Windows'
      shell: pwsh
      run: |
        & "$env:GITHUB_WORKSPACE\.vcpkg\bootstrap-vcpkg.bat" -disableMetrics
        if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed ($LASTEXITCODE)" }
        & "$env:GITHUB_WORKSPACE\.vcpkg\vcpkg.exe" install --overlay-triplets="$env:GITHUB_WORKSPACE\.github\vcpkg-triplets" "ffmpeg[${{ inputs.vcpkg-features }}]:${{ inputs.triplet }}"
        if ($LASTEXITCODE -ne 0) { throw "vcpkg install ffmpeg failed ($LASTEXITCODE)" }

    # Through this repository's own overlay triplet, so the deployment target
    # is pinned rather than the runner's SDK and the build is release only —
    # see .github/vcpkg-triplets.
    - name: Install FFmpeg development libraries (macOS)
      if: steps.ffmpeg.outputs.cache-hit != 'true' && runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        "$GITHUB_WORKSPACE/.vcpkg/bootstrap-vcpkg.sh" -disableMetrics
        "$GITHUB_WORKSPACE/.vcpkg/vcpkg" install \
          --overlay-triplets="$GITHUB_WORKSPACE/.github/vcpkg-triplets" \
          "ffmpeg[${{ inputs.vcpkg-features }}]:${{ inputs.triplet }}"

    # Export `FFMPEG_DIR`, not `VCPKG_ROOT`: `ffmpeg-sys-next` reads it before
    # it attempts any vcpkg or pkg-config discovery, so the pinned tree becomes
    # the only FFmpeg the build can reach.
    #
    # Runs on both paths, so a restored cache is checked as strictly as a fresh
    # build: a truncated or wrong-version tree fails here rather than halfway
    # through generating bindings from it.
    - name: Export FFMPEG_DIR (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $prefix = "$env:GITHUB_WORKSPACE\.vcpkg\installed\${{ inputs.triplet }}"
        if (-not (Test-Path "$prefix\include\libavcodec\avcodec.h")) {
          throw "no FFmpeg headers under $prefix"
        }
        if (-not (Get-ChildItem "$prefix\lib\*avcodec*.lib" -ErrorAction SilentlyContinue)) {
          throw "no FFmpeg import libraries under $prefix"
        }
        # Recorded so a future header mismatch is diagnosable from the log.
        Get-ChildItem "$prefix\include\libavcodec\version*.h" |
          Select-String -Pattern '#define\s+LIBAVCODEC_VERSION_(MAJOR|MINOR)\s'
        "FFMPEG_DIR=$prefix" >> $env:GITHUB_ENV

        # The x64-windows triplet links FFmpeg dynamically: any binary the job
        # runs resolves its avcodec/avutil/etc. DLLs from PATH at run time, not
        # from the import libraries used to link it.
        "$prefix\bin" >> $env:GITHUB_PATH

    - name: Export FFMPEG_DIR (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        prefix="$GITHUB_WORKSPACE/.vcpkg/installed/${{ inputs.triplet }}"
        if [ ! -f "$prefix/include/libavcodec/avcodec.h" ]; then
          echo "no FFmpeg headers under $prefix" >&2
          exit 1
        fi
        if ! compgen -G "$prefix/lib/libavcodec*.dylib" > /dev/null; then
          echo "no FFmpeg shared libraries under $prefix" >&2
          exit 1
        fi
        # Recorded so a future header mismatch is diagnosable from the log.
        grep -E '#define\s+LIBAVCODEC_VERSION_(MAJOR|MINOR)\s' \
          "$prefix"/include/libavcodec/version*.h
        echo "FFMPEG_DIR=$prefix" >> "$GITHUB_ENV"

    # Only reached on a miss, after Export FFMPEG_DIR validated the tree, so
    # this never caches a truncated or wrong-version build.
    - name: Save FFmpeg development libraries to cache
      if: steps.ffmpeg.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: .vcpkg/installed
        key: ${{ steps.key.outputs.key }}
