name: Build

# One workflow, three executables: filmcraft for Windows x64, macOS arm64 and
# macOS x86_64, each an artifact holding the executable with the FFmpeg
# libraries it loads at run time beside it.
#
# How it is shaped, and why:
#
# - `apps/reaction` is not part of this repository (gitignored): it is cloned
#   from the private fedeaxal/reaction with a personal access token in
#   REACTION_REPO_TOKEN. `apps/filmcraft` embeds it as a path dependency, so
#   nothing builds until the clone lands where the manifest looks for it.
# - The Reaction page is built without its `browser` feature — the default —
#   so CEF is neither fetched nor compiled nor shipped: no CEF_PATH, no Ninja,
#   no browser engine in the archive.
# - FFmpeg arrives through the vendored `media` under apps/reaction, linked
#   dynamically: `.github/actions/setup-ffmpeg` builds the same pinned vcpkg
#   tree reaction's own CI does (the action is a copy of its, with the
#   triplet an input so the Intel Mac job can ask for x64-osx-dynamic), and
#   the archive carries the runtime libraries beside the executable.
# - Everything else — codecs, WebRTC, the ASR worker's sherpa-onnx — is pure
#   Rust or statically linked. The one other runtime library is onnxruntime,
#   which the face pipeline (detection, landmarks, beauty filters) loads
#   dynamically and finds beside the executable; each job downloads the
#   official release of it into the archive, so those features work out of
#   the box. The face models themselves are compiled into the executable
#   (`mediapipe`'s `include_bytes!`), so the library is all it takes.

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      reaction-ref:
        description: "git ref of fedeaxal/reaction to build against (empty: its default branch)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # A superseded push's half-built executable is wasted work; nothing here
  # publishes, so cancelling it costs nothing.
  cancel-in-progress: true

env:
  # Nothing reuses a build directory across runs, so incremental compilation
  # only buys extra artifacts to write.
  CARGO_INCREMENTAL: "0"

jobs:
  windows:
    runs-on: windows-2025
    env:
      # One C runtime across everything the executable links. The sherpa-onnx
      # fork's prebuilt Windows static libraries are built with /MT (its
      # release assets are `static-MT-Release`), while a Rust MSVC build
      # defaults to /MD — and cc-compiled /MD objects beside them (rusqlite's
      # bundled sqlite3, tracy-client, aws-lc-sys, ring) fail the link with
      # LNK2038. `crt-static` moves the whole image to /MT instead: rustc
      # links the static CRT, and cc-rs passes /MT to every C dependency it
      # compiles, so all the native code in the image agrees.
      #
      # What it does not reach, by design: FFmpeg — its av*.lib are import
      # libraries, the runtime inside each DLL is that DLL's own, and the
      # archive still carries the redistributable for them — and onnxruntime,
      # which the face pipeline loads at run time.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # The other half of the workspace, from the private fork. `GITHUB_TOKEN`
      # cannot read another repository, private or not — this needs a PAT with
      # read access to fedeaxal/reaction stored as REACTION_REPO_TOKEN.
      - name: Check out reaction
        uses: actions/checkout@v6
        with:
          repository: fedeaxal/reaction
          token: ${{ secrets.REACTION_REPO_TOKEN }}
          # Empty on push events: the repository's default branch.
          ref: ${{ inputs.reaction-ref }}
          path: apps/reaction

      # One command per step: GitHub's pwsh wrapper exits with the *last*
      # command's `$LASTEXITCODE` and a failing native command does not stop
      # the script, so a multi-command step swallows every failure but the
      # final one.
      - name: Install Rust toolchain
        shell: pwsh
        run: rustup toolchain install stable --profile minimal

      - name: Select Rust toolchain
        shell: pwsh
        run: rustup default stable

      - name: Set up FFmpeg
        uses: ./.github/actions/setup-ffmpeg
        with:
          triplet: x64-windows
          vcpkg-features: openh264,nvcodec

      # Downloaded crate sources only, not `target`: the build directory for
      # this dependency graph runs to several gigabytes of small files, and
      # saving and restoring that on Windows costs more than recompiling it.
      # A stale entry here is only a slower build, never a wrong one, so this
      # one does take a prefix fallback.
      - name: Cache downloaded crates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build
        shell: pwsh
        env:
          # Release builds carry the icon and version info or say why not.
          FILMCRAFT_REQUIRE_WINRES: "1"
        run: cargo build --release --locked -p filmcraft

      # The face pipeline's inference engine, which `ort` loads at run time
      # (load-dynamic): the executable does not link it and looks for
      # `onnxruntime.dll` beside itself — see apps/reaction's
      # `src/face/detect.rs`. 1.28 is the version `ort` 2.0.0-rc.13 is
      # developed against. The package Microsoft ships for it carries only
      # the CPU execution provider compiled in, so a DirectML request falls
      # back to CPU exactly as `facelandmark`'s provider list plans for.
      #
      # `tar` rather than Expand-Archive: it can leave the 400 MB .pdb out.
      - name: Download ONNX Runtime
        shell: pwsh
        run: |
          $version = "1.28.0"
          $root = "onnxruntime-win-x64-$version"
          curl.exe -fsSL "https://github.com/microsoft/onnxruntime/releases/download/v$version/$root.zip" -o "$env:RUNNER_TEMP\$root.zip"
          if ($LASTEXITCODE -ne 0) { throw "onnxruntime download failed ($LASTEXITCODE)" }
          New-Item -ItemType Directory -Force -Path .onnxruntime | Out-Null
          tar -xf "$env:RUNNER_TEMP\$root.zip" -C .onnxruntime --exclude=*.pdb
          if ($LASTEXITCODE -ne 0) { throw "onnxruntime extract failed ($LASTEXITCODE)" }
          if (-not (Test-Path ".onnxruntime/$root/lib/onnxruntime.dll")) {
            throw "no onnxruntime.dll in the package"
          }

      # Everything in the FFmpeg tree's `bin`, not the few libraries the
      # executable names: avcodec pulls in openh264, zlib and whatever else
      # the port's dependencies installed, and those are loaded by name at run
      # time exactly as the av* ones are. Copying the directory is both
      # simpler and correct as the port's dependency set changes.
      - name: Stage the archive
        shell: pwsh
        run: |
          $stage = "dist/filmcraft-x86_64-windows-$($env:GITHUB_SHA.Substring(0, 7))"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/filmcraft.exe $stage
          Copy-Item "$env:FFMPEG_DIR/bin/*.dll" $stage

          # The executable and the vcpkg FFmpeg build both link the dynamic
          # Visual C++ runtime, and a stock Windows does not have it — an
          # archive without these opens a "VCRUNTIME140.dll was not found" box
          # instead of the application. The whole `Microsoft.VC*.CRT` folder
          # rather than a list of file names: it is exactly the set Microsoft
          # redistributes together, and picking from it by hand is how an
          # archive ends up missing `vcruntime140_1.dll`.
          $crt = Get-ChildItem "C:/Program Files/Microsoft Visual Studio/*/*/VC/Redist/MSVC/*/x64/Microsoft.VC*.CRT" -Directory |
            Sort-Object { [version]$_.Parent.Parent.Name } |
            Select-Object -Last 1
          if (-not $crt) { throw "no Visual C++ redistributable found on the runner" }
          Write-Host "runtime from $($crt.FullName)"
          Copy-Item "$($crt.FullName)/*.dll" $stage

          # The inference engine, beside the executable where the face
          # pipeline looks for it, and the licences of what the archive
          # bundles: onnxruntime's own, and vcpkg's per-port copyright files,
          # which name the terms of precisely the FFmpeg build being shipped
          # rather than a list kept by hand.
          Copy-Item .onnxruntime/*/lib/*.dll $stage
          New-Item -ItemType Directory -Force -Path "$stage/licenses" | Out-Null
          Copy-Item .onnxruntime/*/LICENSE "$stage/licenses/onnxruntime-LICENSE.txt"
          Copy-Item .onnxruntime/*/ThirdPartyNotices.txt "$stage/licenses/onnxruntime-ThirdPartyNotices.txt"
          Get-ChildItem "$env:FFMPEG_DIR/share" -Filter copyright -Recurse |
            ForEach-Object { Copy-Item $_.FullName "$stage/licenses/$($_.Directory.Name).txt" }

          # For the steps below, which work on what this one made.
          "STAGE=$stage" >> $env:GITHUB_ENV
          Get-ChildItem $stage -Recurse -File | Select-Object FullName, Length

      - name: Check the archive is complete
        shell: pwsh
        run: |
          $stage = $env:STAGE
          if (-not (Test-Path "$stage/filmcraft.exe")) { throw "no executable in the archive" }
          # The one failure that stays invisible until the archive is unpacked
          # on a machine without the FFmpeg tree the build linked against.
          if (-not (Get-ChildItem "$stage/avcodec-*.dll")) { throw "no FFmpeg libraries in the archive" }
          # And the one whose absence shows as a dialog box instead of the
          # application, on any Windows without the redistributable installed.
          if (-not (Test-Path "$stage/vcruntime140.dll")) { throw "no Visual C++ runtime in the archive" }
          # Without it the face features degrade on every machine, silently.
          if (-not (Test-Path "$stage/onnxruntime.dll")) { throw "no ONNX Runtime in the archive" }
          if (-not (Get-ChildItem "$stage/licenses/*.txt")) { throw "no bundled licences in the archive" }

      - name: Pack
        shell: pwsh
        run: |
          $stage = $env:STAGE
          Compress-Archive -Path "$stage/*" -DestinationPath "$stage.zip"

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: filmcraft-x86_64-windows
          path: dist/*.zip
          if-no-files-found: error

  # Two macOS builds, one job: they differ in their runner, their vcpkg
  # triplet and their onnxruntime version, and in nothing else.
  # `macos-15-intel` is the last x86_64 image GitHub offers — when it goes,
  # so does this matrix entry, and with it Intel macOS support.
  macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            triplet: arm64-osx-dynamic
            suffix: arm64-macos
            ort-version: "1.28.0"
            ort-arch: arm64
          - runner: macos-15-intel
            triplet: x64-osx-dynamic
            suffix: x86_64-macos
            # 1.23 is the last release Microsoft shipped an osx-x86_64 binary
            # for. It loads because `ort`, with no api-* feature enabled
            # anywhere in the tree, requests C API version 17 — its feature
            # ladder's floor — which every runtime from 1.17 on answers.
            ort-version: "1.23.0"
            ort-arch: x86_64
    env:
      # What makes the archive self-contained: vcpkg's dylibs are named
      # `@rpath/...`, and the executable searches its own directory before
      # anywhere else. It must survive as these characters because this is a
      # value the linker reads, not a shell command.
      RUSTFLAGS: -C link-arg=-Wl,-rpath,@executable_path
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check out reaction
        uses: actions/checkout@v6
        with:
          repository: fedeaxal/reaction
          token: ${{ secrets.REACTION_REPO_TOKEN }}
          ref: ${{ inputs.reaction-ref }}
          path: apps/reaction

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Set up FFmpeg
        uses: ./.github/actions/setup-ffmpeg
        with:
          triplet: ${{ matrix.triplet }}
          vcpkg-features: openh264

      - name: Cache downloaded crates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build
        run: cargo build --release --locked -p filmcraft

      # The face pipeline's inference engine, as on Windows: loaded at run
      # time, looked for beside the executable (`libonnxruntime.dylib`), and
      # its dependencies are every one system frameworks — CoreML included,
      # which is what the arm64 EP list asks for — so the one dylib is all
      # the archive needs of it. It arrives ad-hoc signed by Microsoft's
      # linker and is copied untouched, which is what Apple silicon requires
      # of it.
      #
      # The 1.28 dylib is built for macOS 14: on 13 the face features degrade
      # the way a missing library degrades them, and nothing else notices.
      - name: Download ONNX Runtime
        run: |
          set -euo pipefail
          version="${{ matrix.ort-version }}"
          root="onnxruntime-osx-${{ matrix.ort-arch }}-$version"
          curl -fsSL "https://github.com/microsoft/onnxruntime/releases/download/v$version/$root.tgz" -o "$RUNNER_TEMP/$root.tgz"
          mkdir -p .onnxruntime
          # The whole package, then the one file that ships: 1.23's members
          # are named `./onnxruntime-...` where 1.28's are not, and the
          # extracted tree is the same either way.
          tar -xzf "$RUNNER_TEMP/$root.tgz" -C .onnxruntime
          cp ".onnxruntime/$root/lib/libonnxruntime.dylib" \
             ".onnxruntime/$root/LICENSE" \
             ".onnxruntime/$root/ThirdPartyNotices.txt" .onnxruntime/
          ls -l .onnxruntime

      # The executable plus every dylib the FFmpeg tree installed, beside it:
      # vcpkg names them `@rpath/...`, they name each other the same way, and
      # the loader resolves all of that through the executable's own
      # `@executable_path` rpath. `cp -R` keeps any symlinks symlinks, so a
      # versioned name and its unversioned alias stay one file, not two.
      - name: Stage the archive
        run: |
          set -euo pipefail
          stage="dist/filmcraft-${{ matrix.suffix }}-${GITHUB_SHA:0:7}"
          mkdir -p "$stage"
          cp target/release/filmcraft "$stage"
          cp -R "$FFMPEG_DIR"/lib/*.dylib "$stage"
          # The inference engine, beside the executable where the face
          # pipeline looks for it, and the licences of what the archive
          # bundles — onnxruntime's own and vcpkg's per-port FFmpeg
          # copyright files, as on Windows.
          cp .onnxruntime/libonnxruntime.dylib "$stage"
          mkdir -p "$stage/licenses"
          cp .onnxruntime/LICENSE "$stage/licenses/onnxruntime-LICENSE.txt"
          cp .onnxruntime/ThirdPartyNotices.txt "$stage/licenses/onnxruntime-ThirdPartyNotices.txt"
          find "$FFMPEG_DIR/share" -name copyright -print0 |
            while IFS= read -r -d '' file; do
              cp "$file" "$stage/licenses/$(basename "$(dirname "$file")").txt"
            done
          # The linker already signed the executable it built; signing it
          # again says so over anything a later step did to it, and costs
          # nothing where it did not. Apple silicon runs nothing unsigned.
          codesign --force --sign - "$stage/filmcraft"
          # For the steps below, which work on what this one made.
          echo "STAGE=$stage" >> "$GITHUB_ENV"
          ls -l "$stage"

      - name: Check the archive is complete
        run: |
          set -euo pipefail
          stage="$STAGE"
          exe="$stage/filmcraft"

          [ -f "$exe" ] || { echo "no executable in the archive" >&2; exit 1; }
          # The search path the whole archive rests on. Without it the loader
          # looks for FFmpeg wherever the machine happens to have a copy.
          otool -l "$exe" | grep -q 'path @executable_path' \
            || { echo "no @executable_path rpath on the executable" >&2; exit 1; }
          # Without FFmpeg beside it the executable does not reach `main`.
          compgen -G "$stage/libavcodec*.dylib" > /dev/null \
            || { echo "no FFmpeg libraries in the archive" >&2; exit 1; }
          # Without it the face features degrade on every machine, silently.
          [ -f "$stage/libonnxruntime.dylib" ] \
            || { echo "no ONNX Runtime in the archive" >&2; exit 1; }
          compgen -G "$stage/licenses/*.txt" > /dev/null \
            || { echo "no bundled licences in the archive" >&2; exit 1; }

          # Every library anything in the archive asks for has to be
          # resolvable from inside it: system libraries are the machine's own,
          # `@rpath/...` names must sit beside the executable, and an absolute
          # path is a build-machine location (`.vcpkg/installed/...`) that no
          # user's Mac has — anything here would fail on theirs instead of in
          # this log. Only Mach-O files are asked: the licences are text. A
          # file's own install name is not one of its dependencies (`otool -L`
          # lists it first all the same), so it is dropped — onnxruntime's is
          # `@rpath/libonnxruntime.<version>.dylib`, and the archive holds the
          # one unversioned name the face pipeline looks for.
          refs=$(
            for file in "$stage"/*; do
              file -b "$file" | grep -q '^Mach-O' || continue
              id=$(otool -D "$file" | tail -n +2 | head -n 1 | awk '{print $1}')
              otool -L "$file" | tail -n +2 | awk '{print $1}' | grep -vxF "$id"
            done
          )
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            case "$ref" in
              /usr/lib/*|/System/*) ;;
              @rpath/*)
                [ -f "$stage/${ref#@rpath/}" ] \
                  || { echo "missing beside the executable: $ref" >&2; exit 1; } ;;
              *)
                echo "reference outside the archive: $ref" >&2; exit 1 ;;
            esac
          done <<< "$refs"
          echo "every library reference resolves inside the archive"

      # `ditto` rather than `zip`: it keeps symlinks, modes and extended
      # attributes, and a macOS archive that flattens those stops being what
      # it was staged as.
      - name: Pack
        run: |
          set -euo pipefail
          stage="$STAGE"
          ditto -c -k --keepParent "$stage" "$stage.zip"

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: filmcraft-${{ matrix.suffix }}
          path: dist/*.zip
          if-no-files-found: error
