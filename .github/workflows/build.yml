name: Build

# One workflow, three platform builds: Windows x64, macOS arm64 and macOS
# x86_64. Each runs this repository's own packaging script —
# `packaging/windows/package.ps1` for the MSI installer and portable zip,
# `packaging/macos/package.sh` for the drag-to-Applications DMG — and each
# artifact is the platform's usual distribution format, not a bare folder.
#
# How it is shaped, and why:
#
# - `apps/reaction` is not part of this repository (gitignored): it is cloned
#   from the private fedeaxal/reaction with a personal access token in
#   REACTION_REPO_TOKEN. `apps/filmcraft` embeds it as a path dependency, so
#   nothing builds until the clone lands where the manifest looks for it.
# - The Reaction page is built without its `browser` feature — the default —
#   so CEF is neither fetched nor compiled nor shipped: no CEF_PATH, no Ninja,
#   no browser engine in the installers.
# - FFmpeg arrives through the vendored `media` under apps/reaction, linked
#   dynamically: `.github/actions/setup-ffmpeg` builds the same pinned vcpkg
#   tree reaction's own CI does (the action is a copy of its, with the
#   triplet an input so the Intel Mac job can ask for x64-osx-dynamic), and
#   the packaging scripts stage the runtime DLLs / dylibs — and, on Windows,
#   the Visual C++ redistributable those DLLs need — beside the executable.
# - Everything else — codecs, WebRTC, the ASR worker's sherpa-onnx — is pure
#   Rust or statically linked. The one other runtime library is onnxruntime,
#   which the face pipeline (detection, landmarks, beauty filters) loads
#   dynamically and finds beside the executable; each job downloads the
#   official release of it into the package, so those features work out of
#   the box. The face models themselves are compiled into the executable
#   (`mediapipe`'s `include_bytes!`), so the library is all it takes.

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      reaction-ref:
        description: "git ref of fedeaxal/reaction to build against (empty: its default branch)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # A superseded push's half-built installer is wasted work; nothing here
  # publishes, so cancelling it costs nothing.
  cancel-in-progress: true

env:
  # Nothing reuses a build directory across runs, so incremental compilation
  # only buys extra artifacts to write.
  CARGO_INCREMENTAL: "0"
  # Where the packaging scripts leave their artifacts for the upload step.
  DIST: ${{ github.workspace }}/dist

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # The other half of the workspace, from the private fork. `GITHUB_TOKEN`
      # cannot read another repository, private or not — this needs a PAT with
      # read access to fedeaxal/reaction stored as REACTION_REPO_TOKEN.
      - name: Check out reaction
        uses: actions/checkout@v6
        with:
          repository: fedeaxal/reaction
          token: ${{ secrets.REACTION_REPO_TOKEN }}
          # Empty on push events: the repository's default branch.
          ref: ${{ inputs.reaction-ref }}
          path: apps/reaction

      # One command per step: GitHub's pwsh wrapper exits with the *last*
      # command's `$LASTEXITCODE` and a failing native command does not stop
      # the script, so a multi-command step swallows every failure but the
      # final one.
      - name: Install Rust toolchain
        shell: pwsh
        run: rustup toolchain install stable --profile minimal

      - name: Select Rust toolchain
        shell: pwsh
        run: rustup default stable

      - name: Set up FFmpeg
        uses: ./.github/actions/setup-ffmpeg
        with:
          triplet: x64-windows
          vcpkg-features: openh264,nvcodec

      # Downloaded crate sources only, not `target`: the build directory for
      # this dependency graph runs to several gigabytes of small files, and
      # saving and restoring that on Windows costs more than recompiling it.
      # A stale entry here is only a slower build, never a wrong one, so this
      # one does take a prefix fallback.
      - name: Cache downloaded crates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # The face pipeline's inference engine is ort's official prebuilt,
      # statically linked at build time (ort-sys fetches it from pyke's CDN
      # while compiling `facelandmark`): 1.28.0, the version `ort`
      # 2.0.0-rc.13 is developed against, with the DirectML EP compiled in —
      # no onnxruntime.dll is needed for the face pipeline. The pyke static
      # library is /MD-built, which is why the host build is /MD (no
      # +crt-static — see .cargo/config.toml for how that follows from the
      # ASR worker's sherpa-onnx switching to a self-contained DLL).
      #
      # That DLL — sherpa-onnx-c-api.dll — does not exist as a prebuilt asset
      # anywhere: the fork's releases carry static libraries only, and the
      # upstream k2-fsa shared packages lack the fork's UpdateHotwords API.
      # So we build it right here from the fork at the rev Cargo.lock pins,
      # with the exact arguments the fork's own static-lib CI uses, minus
      # TTS (the ASR worker never touches it) and with BUILD_SHARED_LIBS=ON /
      # static CRT — the layout and tar name `sherpa-onnx-sys`'s build script
      # resolves through SHERPA_ONNX_ARCHIVE_DIR. cmake downloads ORT 1.24.4
      # itself; its onnxruntime.dll ships with the package for the DLL.
      - name: Build the ASR worker's sherpa-onnx DLL
        shell: pwsh
        env:
          HOTWORD_REV: f51c0cfa7eb5c46e0bdf275120269a8ef9cb6f3d
        run: |
          git clone --quiet https://github.com/letdevme/hotword.git "$env:RUNNER_TEMP\hotword"
          git -C "$env:RUNNER_TEMP\hotword" checkout --quiet $env:HOTWORD_REV
          cmake -S "$env:RUNNER_TEMP\hotword" -B "$env:RUNNER_TEMP\hotword\build" -A x64 `
            -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$env:RUNNER_TEMP\hotword\build\install" `
            -DSHERPA_ONNX_USE_STATIC_CRT=ON -DSHERPA_ONNX_ENABLE_TTS=OFF `
            -DSHERPA_ONNX_ENABLE_PYTHON=OFF -DSHERPA_ONNX_ENABLE_TESTS=OFF `
            -DSHERPA_ONNX_ENABLE_BINARY=OFF -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF `
            -DSHERPA_ONNX_ENABLE_JNI=OFF -DSHERPA_ONNX_ENABLE_PORTAUDIO=OFF
          if ($LASTEXITCODE -ne 0) { throw "sherpa cmake failed ($LASTEXITCODE)" }
          cmake --build "$env:RUNNER_TEMP\hotword\build" --config Release --target install --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "sherpa build failed ($LASTEXITCODE)" }
          New-Item -ItemType Directory -Force -Path .sherpa-shim | Out-Null
          $stem = "sherpa-onnx-v1.13.2-win-x64-shared-MT-Release-lib"
          $lib = "$env:RUNNER_TEMP\$stem\lib"
          New-Item -ItemType Directory -Force -Path $lib | Out-Null
          Copy-Item "$env:RUNNER_TEMP\hotword\build\install\lib\*" $lib
          # cmake installs the downloaded ORT runtime DLLs under bin\; the archive
          # sherpa-onnx-sys unpacks must carry them in lib\ beside the import libs.
          Copy-Item "$env:RUNNER_TEMP\hotword\build\install\bin\*.dll" $lib -ErrorAction SilentlyContinue
          if (-not (Test-Path "$lib\sherpa-onnx-c-api.dll") -or -not (Test-Path "$lib\onnxruntime.dll")) {
            throw "sherpa DLLs missing after build (need c-api.dll and onnxruntime.dll in lib\)"
          }
          tar -cjf ".sherpa-shim\$stem.tar.bz2" -C "$env:RUNNER_TEMP" $stem
          if ($LASTEXITCODE -ne 0) { throw "sherpa pack failed ($LASTEXITCODE)" }

      # The MSI toolchain: `package.ps1` adds the UI extension itself.
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw "wix install failed ($LASTEXITCODE)" }

      # Builds (/MD, per-target), stages the FFmpeg / sherpa-onnx / DirectML /
      # VC++ runtime DLLs beside the executables, and produces
      # filmcraft-<version>-windows-x64.msi and the portable zip. Signing is
      # skipped with a warning: no certificate is configured here.
      - name: Package
        shell: pwsh
        env:
          # Where the tar `sherpa-onnx-sys`'s build script resolves (see the
          # DLL build step above); package.ps1 passes it through to cargo.
          SHERPA_ONNX_ARCHIVE_DIR: ${{ github.workspace }}\.sherpa-shim
        run: pwsh packaging/windows/package.ps1 -Arch x64

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: filmcraft-x86_64-windows
          path: |
            dist/*.msi
            dist/*-portable.zip
          if-no-files-found: error

  # Two macOS builds, one job: they differ in their runner, their vcpkg
  # triplet, their onnxruntime version and their --arch, and in nothing else.
  # `macos-15-intel` is the last x86_64 image GitHub offers — when it goes,
  # so does this matrix entry, and with it Intel macOS support.
  macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            triplet: arm64-osx-dynamic
            suffix: arm64-macos
            arch: aarch64
            ort-version: "1.28.0"
            ort-arch: arm64
          - runner: macos-15-intel
            triplet: x64-osx-dynamic
            suffix: x86_64-macos
            arch: x86_64
            # 1.23 is the last release Microsoft shipped an osx-x86_64 binary
            # for. It loads because `ort`, with no api-* feature enabled
            # anywhere in the tree, requests C API version 17 — its feature
            # ladder's floor — which every runtime from 1.17 on answers.
            ort-version: "1.23.0"
            ort-arch: x86_64
    env:
      # What makes the bundle self-contained: vcpkg's dylibs are named
      # `@rpath/...`, and the executable searches its own directory before
      # anywhere else. It must survive as these characters because this is a
      # value the linker reads, not a shell command.
      RUSTFLAGS: -C link-arg=-Wl,-rpath,@executable_path
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check out reaction
        uses: actions/checkout@v6
        with:
          repository: fedeaxal/reaction
          token: ${{ secrets.REACTION_REPO_TOKEN }}
          ref: ${{ inputs.reaction-ref }}
          path: apps/reaction

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Set up FFmpeg
        uses: ./.github/actions/setup-ffmpeg
        with:
          triplet: ${{ matrix.triplet }}
          vcpkg-features: openh264

      - name: Cache downloaded crates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # The face pipeline's inference engine, as on Windows: ort's official
      # prebuilt, statically linked at build time (CoreML EP compiled into
      # the arm64 build — its dependencies are every one system frameworks,
      # so nothing extra ships beside the executable). The download below is
      # only for the x86_64 matrix leg: pyke's CDN has no Intel-mac prebuilt
      # (ort 2.0.0-rc.13's minimum supported targets end at Intel macOS), so
      # that leg builds with `load-dynamic` and carries Microsoft's dylib —
      # 1.23.0, the last release Microsoft shipped an osx-x86_64 binary for.
      # It loads because `ort`, with no api-* feature enabled anywhere in
      # the tree, requests C API version 17, which every runtime from 1.17
      # on answers. It arrives ad-hoc signed and is re-signed ad hoc by the
      # packaging script, which is what Apple silicon requires of it.
      #
      # The 1.28 dylib is built for macOS 14: on 13 the face features degrade
      # the way a missing library degrades them, and nothing else notices.
      - name: Download ONNX Runtime
        if: matrix.arch == 'x86_64'
        run: |
          set -euo pipefail
          version="${{ matrix.ort-version }}"
          root="onnxruntime-osx-${{ matrix.ort-arch }}-$version"
          curl -fsSL "https://github.com/microsoft/onnxruntime/releases/download/v$version/$root.tgz" -o "$RUNNER_TEMP/$root.tgz"
          mkdir -p .onnxruntime
          # The whole package, then the files that ship: 1.23's members are
          # named `./onnxruntime-...` where 1.28's are not, and the extracted
          # tree is the same either way.
          tar -xzf "$RUNNER_TEMP/$root.tgz" -C .onnxruntime
          cp ".onnxruntime/$root/lib/libonnxruntime.dylib" \
             ".onnxruntime/$root/LICENSE" \
             ".onnxruntime/$root/ThirdPartyNotices.txt" .onnxruntime/
          ls -l .onnxruntime

      # Builds (--target this matrix arch), assembles FilmCraft.app with the
      # FFmpeg dylib beside the executable (and, on Intel, the ONNX Runtime
      # dylib the step above downloaded), checks the bundle is self-contained,
      # signs ad hoc (no certificate here: Gatekeeper asks about a downloaded
      # copy — docs/install.md says how to let it open) and lays it on a
      # drag-to-Applications DMG, plus the headless CLI zip.
      - name: Package
        run: packaging/macos/package.sh --arch ${{ matrix.arch }}
        env:
          ONNXRUNTIME_DIR: ${{ github.workspace }}/.onnxruntime

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: filmcraft-${{ matrix.suffix }}
          path: |
            dist/*.dmg
            dist/*cli*.zip
          if-no-files-found: error
