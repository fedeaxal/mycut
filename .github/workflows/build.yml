name: Build

# One workflow, three platform builds: Windows x64, macOS arm64 and macOS
# x86_64. Each runs this repository's own packaging script —
# `packaging/windows/package.ps1` for the MSI installer and portable zip,
# `packaging/macos/package.sh` for the drag-to-Applications DMG — and each
# artifact is the platform's usual distribution format, not a bare folder.
#
# How it is shaped, and why:
#
# - `apps/reaction` is not part of this repository (gitignored): it is cloned
#   from the private fedeaxal/reaction with a personal access token in
#   REACTION_REPO_TOKEN. `apps/filmcraft` embeds it as a path dependency, so
#   nothing builds until the clone lands where the manifest looks for it.
# - `Cargo.lock` is generated against apps/reaction as it stands in the studio
#   workspace, and every build runs --locked: the clone must match that lock
#   or resolution dies. Each job therefore verifies the lock right after
#   installing Rust and fails early — printing the would-be diff — instead of
#   losing the run to a --locked error inside Package, after the slow setup
#   steps have already burned their minutes. When it fails, the fork's default
#   branch and the lock have drifted: sync the fork with the studio copy of
#   apps/reaction (or regenerate Cargo.lock against the fork) and commit it.
# - The Reaction page is built without its `browser` feature — the default —
#   so CEF is neither fetched nor compiled nor shipped: no CEF_PATH, no Ninja,
#   no browser engine in the installers.
# - FFmpeg arrives through the vendored `media` under apps/reaction, linked
#   dynamically: `.github/actions/setup-ffmpeg` builds the same pinned vcpkg
#   tree reaction's own CI does (the action is a copy of its, with the
#   triplet an input so the Intel Mac job can ask for x64-osx-dynamic), and
#   the packaging scripts stage the runtime DLLs / dylibs — and, on Windows,
#   the Visual C++ redistributable those DLLs need — beside the executable.
# - Everything else — codecs, WebRTC, the ASR worker's sherpa-onnx — is pure
#   Rust or statically linked. The one other runtime library is onnxruntime,
#   which the face pipeline (detection, landmarks, beauty filters) loads
#   dynamically and finds beside the executable; each job downloads the
#   official release of it into the package, so those features work out of
#   the box. The face models themselves are compiled into the executable
#   (`mediapipe`'s `include_bytes!`), so the library is all it takes.

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      reaction-ref:
        description: "git ref of fedeaxal/reaction to build against (empty: its default branch)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # A superseded push's half-built installer is wasted work; nothing here
  # publishes, so cancelling it costs nothing.
  cancel-in-progress: true

env:
  # Nothing reuses a build directory across runs, so incremental compilation
  # only buys extra artifacts to write.
  CARGO_INCREMENTAL: "0"
  # Where the packaging scripts leave their artifacts for the upload step.
  DIST: ${{ github.workspace }}/dist

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The other half of the workspace, from the private fork. `GITHUB_TOKEN`
      # cannot read another repository, private or not — this needs a PAT with
      # read access to fedeaxal/reaction stored as REACTION_REPO_TOKEN.
      - name: Check out reaction
        uses: actions/checkout@v7
        with:
          repository: fedeaxal/reaction
          token: ${{ secrets.REACTION_REPO_TOKEN }}
          # Empty on push events: the repository's default branch.
          ref: ${{ inputs.reaction-ref }}
          path: apps/reaction

      # One command per step: GitHub's pwsh wrapper exits with the *last*
      # command's `$LASTEXITCODE` and a failing native command does not stop
      # the script, so a multi-command step swallows every failure but the
      # final one.
      # static.rust-lang.org blips (transient DNS resolution failures on the
      # runner) have killed runs here; they clear within seconds, so retry
      # before failing a build that would otherwise have been fine.
      - name: Install Rust toolchain
        shell: pwsh
        run: |
          foreach ($i in 1, 2, 3) {
            rustup toolchain install stable --profile minimal
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "rustup attempt $i failed; retrying in 20s"
            Start-Sleep -Seconds 20
          }
          throw "rustup failed after 3 attempts"

      - name: Select Rust toolchain
        shell: pwsh
        run: rustup default stable

      # See the header: the lock was written against the studio copy of
      # apps/reaction, and this job cloned fedeaxal/reaction instead. Verify
      # before the slow setup steps, not inside Package twenty minutes later.
      - name: Verify Cargo.lock covers the checked-out reaction
        shell: pwsh
        run: |
          cargo metadata --locked --format-version 1 > $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Cargo.lock does not match the checked-out reaction. Sync fedeaxal/reaction with the studio copy of apps/reaction (or regenerate Cargo.lock against the fork) and commit the lock. The would-be changes:"
            cargo update --workspace --dry-run
            exit 1
          }
          Write-Host "Cargo.lock matches the checked-out workspace"

      - name: Set up FFmpeg
        uses: ./.github/actions/setup-ffmpeg
        with:
          triplet: x64-windows
          vcpkg-features: openh264,nvcodec

      # Downloaded crate sources only, not `target`: the build directory for
      # this dependency graph runs to several gigabytes of small files, and
      # saving and restoring that on Windows costs more than recompiling it.
      # A stale entry here is only a slower build, never a wrong one, so this
      # one does take a prefix fallback.
      - name: Cache downloaded crates
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # The face pipeline's inference engine loads at run time, like on the
      # macOS legs (`load-dynamic` — crates/mediapipe/Cargo.toml): Microsoft's
      # official onnxruntime.dll, downloaded below from nuget.org and staged
      # beside the executable by package.ps1. It replaced ort's pyke
      # download-binaries statics, which are AVX2-compiled: their C++
      # initializers executed BMI2 instructions before main and the launcher
      # died with 0xc000001d on pre-AVX2 CPUs (an Ivy Bridge i5-3470;
      # 2026-11-21). The official build dispatches CPU features at run time,
      # carries the DirectML EP statically linked inside, and its 1.24.4 C
      # API also serves the ASR DLL built below against 1.24.4 — so it
      # supersedes the CPU-only onnxruntime.dll the sherpa cmake stages. The
      # host build stays /MD (no +crt-static — see .cargo/config.toml; pyke's
      # /MD statics were the original constraint, and the vcpkg FFmpeg DLLs'
      # own /MD keeps the redistributable shipped either way).
      #
      # That DLL — sherpa-onnx-c-api.dll — does not exist as a prebuilt asset
      # anywhere: the fork's releases carry static libraries only, and the
      # upstream k2-fsa shared packages lack the fork's UpdateHotwords API.
      # So we build it right here from the fork at the rev Cargo.lock pins,
      # with the exact arguments the fork's own static-lib CI uses, minus
      # TTS (the ASR worker never touches it) and with BUILD_SHARED_LIBS=ON /
      # static CRT — the layout and tar name `sherpa-onnx-sys`'s build script
      # resolves through SHERPA_ONNX_ARCHIVE_DIR. cmake downloads ORT 1.24.4
      # itself; its onnxruntime.dll ships with the package for the DLL.
      - name: Build the ASR worker's sherpa-onnx DLL
        shell: pwsh
        env:
          HOTWORD_REV: f51c0cfa7eb5c46e0bdf275120269a8ef9cb6f3d
        run: |
          git clone --quiet https://github.com/letdevme/hotword.git "$env:RUNNER_TEMP\hotword"
          git -C "$env:RUNNER_TEMP\hotword" checkout --quiet $env:HOTWORD_REV
          cmake -S "$env:RUNNER_TEMP\hotword" -B "$env:RUNNER_TEMP\hotword\build" -A x64 `
            -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$env:RUNNER_TEMP\hotword\build\install" `
            -DSHERPA_ONNX_USE_STATIC_CRT=ON -DSHERPA_ONNX_ENABLE_TTS=OFF `
            -DSHERPA_ONNX_ENABLE_PYTHON=OFF -DSHERPA_ONNX_ENABLE_TESTS=OFF `
            -DSHERPA_ONNX_ENABLE_BINARY=OFF -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF `
            -DSHERPA_ONNX_ENABLE_JNI=OFF -DSHERPA_ONNX_ENABLE_PORTAUDIO=OFF
          if ($LASTEXITCODE -ne 0) { throw "sherpa cmake failed ($LASTEXITCODE)" }
          cmake --build "$env:RUNNER_TEMP\hotword\build" --config Release --target install --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "sherpa build failed ($LASTEXITCODE)" }
          New-Item -ItemType Directory -Force -Path .sherpa-shim | Out-Null
          $stem = "sherpa-onnx-v1.13.2-win-x64-shared-MT-Release-lib"
          $lib = "$env:RUNNER_TEMP\$stem\lib"
          New-Item -ItemType Directory -Force -Path $lib | Out-Null
          Copy-Item "$env:RUNNER_TEMP\hotword\build\install\lib\*" $lib
          # cmake installs the downloaded ORT runtime DLLs under bin\; the archive
          # sherpa-onnx-sys unpacks must carry them in lib\ beside the import libs.
          # The CPU-only onnxruntime.dll that lands here is superseded in the
          # package by the DirectML NuGet's copy (same 1.24.4) — package.ps1.
          Copy-Item "$env:RUNNER_TEMP\hotword\build\install\bin\*.dll" $lib -ErrorAction SilentlyContinue
          if (-not (Test-Path "$lib\sherpa-onnx-c-api.dll") -or -not (Test-Path "$lib\onnxruntime.dll")) {
            throw "sherpa DLLs missing after build (need c-api.dll and onnxruntime.dll in lib\)"
          }
          tar -cjf ".sherpa-shim\$stem.tar.bz2" -C "$env:RUNNER_TEMP" $stem
          if ($LASTEXITCODE -ne 0) { throw "sherpa pack failed ($LASTEXITCODE)" }

      # Microsoft's official DirectML-flavored ONNX Runtime for the face
      # pipeline (see the step above). 1.24.4 is the last release Microsoft
      # shipped a DirectML build of. A nuget.org package is byte-identical
      # for a given version and carries the publisher's signature, so the
      # sha256 pins the official bytes — no mirror dance here, unlike the
      # macOS legs whose GitHub release home has 404'd outright since
      # 2026-11-17. Only the win-x64 runtime files and the licence texts are
      # extracted; ONNXRUNTIME_DIR hands them to package.ps1. The nupkg is a
      # zip and the runner's tar (bsdtar) unpacks it by content.
      - name: Download ONNX Runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .onnxruntime | Out-Null
          curl.exe -fsSL -o "$env:RUNNER_TEMP\ort-directml.nupkg" `
            "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime.directml/1.24.4/microsoft.ml.onnxruntime.directml.1.24.4.nupkg"
          if ($LASTEXITCODE -ne 0) { throw "onnxruntime download failed ($LASTEXITCODE)" }
          $want = '57E9F11B73437BEF7A309496135D4C1F96B1A8E9DDBA60013FA27BFC1D788681'
          $got = (Get-FileHash -Algorithm SHA256 "$env:RUNNER_TEMP\ort-directml.nupkg").Hash
          if ($got -cne $want) { throw "onnxruntime nupkg sha256 mismatch: $got" }
          tar -xf "$env:RUNNER_TEMP\ort-directml.nupkg" -C .onnxruntime `
            'runtimes/win-x64/native/onnxruntime.dll' `
            'runtimes/win-x64/native/onnxruntime_providers_shared.dll' `
            'LICENSE' 'ThirdPartyNotices.txt'
          if ($LASTEXITCODE -ne 0) { throw "onnxruntime unpack failed ($LASTEXITCODE)" }
          Move-Item .onnxruntime\runtimes\win-x64\native\*.dll .onnxruntime
          Remove-Item -Recurse -Force .onnxruntime\runtimes
          Get-ChildItem .onnxruntime

      # The MSI toolchain: `package.ps1` adds the UI extension itself.
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw "wix install failed ($LASTEXITCODE)" }

      # Builds (/MD, per-target), stages the FFmpeg / sherpa-onnx / ONNX
      # Runtime / VC++ runtime DLLs beside the executables, and produces
      # reacut-<version>-windows-x64.msi and the portable zip. Signing is
      # skipped with a warning: no certificate is configured here.
      - name: Package
        shell: pwsh
        env:
          # Where the tar `sherpa-onnx-sys`'s build script resolves (see the
          # DLL build step above); package.ps1 passes it through to cargo.
          SHERPA_ONNX_ARCHIVE_DIR: ${{ github.workspace }}\.sherpa-shim
          # The official ONNX Runtime for the face pipeline (see the download
          # step above); package.ps1 stages its DLLs beside the executables,
          # replacing the sherpa cmake's CPU-only copy.
          ONNXRUNTIME_DIR: ${{ github.workspace }}\.onnxruntime
        run: pwsh packaging/windows/package.ps1 -Arch x64

      - name: Upload the artifacts
        uses: actions/upload-artifact@v7
        with:
          name: reacut-x86_64-windows
          path: |
            dist/*.msi
            dist/*-portable.zip
          if-no-files-found: error

  # Two macOS builds, one job: they differ in their runner, their vcpkg
  # triplet, their onnxruntime version and their --arch, and in nothing else.
  # `macos-15-intel` is the last x86_64 image GitHub offers — when it goes,
  # so does this matrix entry, and with it Intel macOS support.
  macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            triplet: arm64-osx-dynamic
            suffix: arm64-macos
            arch: aarch64
            ort-version: "1.23.2"
            ort-arch: arm64
          - runner: macos-15-intel
            triplet: x64-osx-dynamic
            suffix: x86_64-macos
            arch: x86_64
            # 1.23.2 is the last release Microsoft shipped an osx-x86_64
            # binary for, and the replacement for 1.23.0, which was withdrawn
            # upstream (404). It loads because `ort`, with no api-* feature
            # enabled anywhere in the tree, requests C API version 17 — its
            # feature ladder's floor — which every runtime from 1.17 on
            # answers.
            ort-version: "1.23.2"
            ort-arch: x86_64
    env:
      # What makes the bundle self-contained: vcpkg's dylibs are named
      # `@rpath/...`, and the executable searches its own directory before
      # anywhere else. It must survive as these characters because this is a
      # value the linker reads, not a shell command.
      RUSTFLAGS: -C link-arg=-Wl,-rpath,@executable_path
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out reaction
        uses: actions/checkout@v7
        with:
          repository: fedeaxal/reaction
          token: ${{ secrets.REACTION_REPO_TOKEN }}
          ref: ${{ inputs.reaction-ref }}
          path: apps/reaction

      # macos-15-intel has failed this step with transient DNS errors
      # ("nodename nor servname provided, or not known" against
      # static.rust-lang.org); they clear within seconds, so retry before
      # failing the job.
      - name: Install Rust
        run: |
          for i in 1 2 3; do
            if rustup toolchain install stable --profile minimal && rustup default stable; then
              exit 0
            fi
            echo "rustup attempt $i failed; retrying in 20s" >&2
            sleep 20
          done
          echo "rustup failed after 3 attempts" >&2
          exit 1

      # See the header: the lock was written against the studio copy of
      # apps/reaction, and this job cloned fedeaxal/reaction instead. Verify
      # before the slow setup steps, not inside Package twenty minutes later.
      - name: Verify Cargo.lock covers the checked-out reaction
        run: |
          set -euo pipefail
          if cargo metadata --locked --format-version 1 > /dev/null 2>&1; then
            echo "Cargo.lock matches the checked-out workspace"
            exit 0
          fi
          echo "::error::Cargo.lock does not match the checked-out reaction. Sync fedeaxal/reaction with the studio copy of apps/reaction (or regenerate Cargo.lock against the fork) and commit the lock. The would-be changes:"
          cargo update --workspace --dry-run || true
          exit 1

      - name: Set up FFmpeg
        uses: ./.github/actions/setup-ffmpeg
        with:
          triplet: ${{ matrix.triplet }}
          vcpkg-features: openh264

      - name: Cache downloaded crates
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # The face pipeline's inference engine, on both macOS legs: Microsoft's
      # official dylib, loaded at run time (`load-dynamic` — the facelandmark
      # Cargo.toml splits macOS this way; the Windows job still statically
      # links pyke's prebuilt). Both legs carry 1.23.2: the last release
      # Microsoft shipped an osx binary for, and the replacement for 1.23.0,
      # which was withdrawn upstream — the 404 that broke this job before.
      # It loads because `ort`, with no api-* feature enabled anywhere in the
      # tree, requests C API version 17, which every runtime from 1.17 on
      # answers; the CoreML EP ships inside the dylib, which is what the
      # arm64 EP list asks for. It arrives ad-hoc signed and is re-signed ad
      # hoc by the packaging script, which is what Apple silicon requires of
      # it. The release tarball now comes from PhotoPrism's long-standing
      # mirror of the official assets: microsoft/onnxruntime vanished from
      # GitHub outright on 2026-11-17 (404 for the whole repository —
      # sources, releases and all), so the official URL is tried first for
      # self-healing but the mirror is what actually answers; the checksum
      # pins whichever copy arrives to the official bytes.
      - name: Download ONNX Runtime
        run: |
          set -euo pipefail
          version="${{ matrix.ort-version }}"
          root="onnxruntime-osx-${{ matrix.ort-arch }}-$version"
          # sha256 of the official release tarballs, as mirrored at
          # dl.photoprism.app (verified against the mirror's copy: same
          # GIT_COMMIT_ID a83fc4d5, same layout, ad-hoc signed — unlike
          # csukuangfj/onnxruntime-libs' repackaged zips, which are a
          # different rebuild without CoreML guarantees).
          case "${{ matrix.ort-arch }}" in
            arm64)
              want="b4d513ab2b26f088c66891dbbc1408166708773d7cc4163de7bdca0e9bbb7856"
              ;;
            x86_64)
              want="d10359e16347b57d9959f7e80a225a5b4a66ed7d7e007274a15cae86836485a6"
              ;;
          esac
          curl -fsSL "https://github.com/microsoft/onnxruntime/releases/download/v$version/$root.tgz" -o "$RUNNER_TEMP/$root.tgz" \
            || curl -fsSL "https://dl.photoprism.app/onnx/runtime/v$version/$root.tgz" -o "$RUNNER_TEMP/$root.tgz"
          echo "$want  $RUNNER_TEMP/$root.tgz" | shasum -a 256 -c -
          mkdir -p .onnxruntime
          # The whole package, then the files that ship: the tarball nests
          # everything under `./onnxruntime-...`, and the cp below strips
          # that level.
          tar -xzf "$RUNNER_TEMP/$root.tgz" -C .onnxruntime
          cp ".onnxruntime/$root/lib/libonnxruntime.dylib" \
             ".onnxruntime/$root/LICENSE" \
             ".onnxruntime/$root/ThirdPartyNotices.txt" .onnxruntime/
          ls -l .onnxruntime

      # Builds (--target this matrix arch), assembles Reacut.app with the
      # FFmpeg and ONNX Runtime dylibs beside the executable, checks the
      # bundle is self-contained,
      # signs ad hoc (no certificate here: Gatekeeper asks about a downloaded
      # copy — docs/install.md says how to let it open) and lays it on a
      # drag-to-Applications DMG, plus the headless CLI zip.
      - name: Package
        run: packaging/macos/package.sh --arch ${{ matrix.arch }}
        env:
          ONNXRUNTIME_DIR: ${{ github.workspace }}/.onnxruntime

      - name: Upload the artifacts
        uses: actions/upload-artifact@v7
        with:
          name: reacut-${{ matrix.suffix }}
          path: |
            dist/*.dmg
            dist/*cli*.zip
          if-no-files-found: error
