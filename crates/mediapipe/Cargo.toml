[package]
name = "facelandmark"
version = "0.2.0"
edition = "2024"
description = "MediaPipe 人脸检测/关键点/表情系数/人像分割推理库（ONNX Runtime）及命令行工具"
license = "MIT"

[lib]
name = "facelandmark"
path = "src/lib.rs"

[[bin]]
name = "facelandmark-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.98"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
fast_image_resize = "5.1.4"
ndarray = { version = "0.17", features = ["rayon"] }
rayon = "1.10.0"
# 执行提供者回退等记录进宿主的统一日志文件（树内其余纯 Rust 库同一门面）
log = { workspace = true }
# 仅在通过 `--tracy` 启动采集时才有开销，平时为空操作，保留原工程的性能分析能力
tracy-client = "0.18.0"

# ONNX Runtime 按目标平台取用与开执行提供者；模型与 EP 在 utils::Ep 里再按
# 平台选择。ndarray feature 供输入张量走 ndarray 视图（ort 侧也是 0.17，与
# 本项目统一）。
#
# Apple Silicon：load-dynamic，运行时加载官方 dylib（CI 的 macos 包随包携带
# 1.23.2 的 osx-arm64 库；1.23.0 被微软撤回，由 1.23.2 取代）。coreml
# feature 只把 CoreML EP 的 API 绑定编译进来，EP 本体在 dylib 里。
#
# Windows：同样 load-dynamic，运行时加载微软官方 DirectML NuGet 的
# onnxruntime.dll（CPU 与 DirectML EP 内置，DirectML 静态内链——无需单独
# 的 DirectML.dll）。pyke CDN 的 download-binaries 静态库是 AVX2 目标编译
# 的（ort 官方文档明言其 Windows 静态版要求 AVX2），其 C++ 全局初始化在
# main 之前就执行 SHLX/MULX 一类 BMI2 指令，Ivy Bridge（i5-3470）这类不
# 支持 AVX2/BMI2 的老 CPU 上启动即崩 0xC000001D（CI 包 2026-11-21 实锤）；
# 微软官方预编译按 CPU 特性做运行时分发，无此问题，故与其余目标一致走
# load-dynamic——exe 不再链任何 ORT 字节，ORT 全部来自随包的官方 DLL。
# directml feature 只把 DML EP 的 API 绑定编译进来，EP 本体在 DLL 里。
# 随包 DLL 取 1.24.4（微软最后一个官方 DirectML 版构建），由 CI 从
# nuget.org 拉取 Microsoft.ML.OnnxRuntime.DirectML 并覆盖 sherpa cmake
# 自带的 CPU-only 副本——版本同为 1.24.4，ASR 侧 sherpa DLL 的 C API
# 请求不受影响，人脸线与 ASR 共用这一份（见 .github/workflows/build.yml
# 与 packaging/windows/package.ps1）。
#
# 其余目标（Intel macOS / Linux）：官方没有 Intel mac 的预编译，走
# load-dynamic（CI 的 x86_64 mac 包携带 1.23.2 dylib；ort 未开任何 api-*
# feature 时请求 C API 17，1.17 起的运行时都能应答）。这两个目标 Auto 恒
# CPU——Intel 核显上 CoreML 实测反而更慢。
# 所有目标都 load-dynamic：init_from 的调用点不再按目标划分 cfg，但调整
# 这里的 EP feature 归属仍需同步 utils::Ep 的文档与 push_ep 的 cfg 臂。
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
ort = { version = "2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    "load-dynamic",
    "coreml",
] }

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    "load-dynamic",
    "directml",
] }

[target.'cfg(not(any(all(target_os = "macos", target_arch = "aarch64"), target_os = "windows")))'.dependencies]
ort = { version = "2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    "load-dynamic",
] }
