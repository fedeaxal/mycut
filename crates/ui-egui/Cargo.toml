[package]
name = "filmcraft-ui-egui"
description = "The FilmCraft egui frontend (swappable): panels, docking, timeline, monitors, control channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]

# Studio 的另一半:同一 workspace 里的 reaction,Reaction 模式把它内嵌进本窗口
# (见 panels::reaction)。它是库 + 薄二进制的 crate,这里链接的是库。
reaction = { path = "../../apps/reaction" }

# The project wall's covers: PNGs filmcraft-cli rendered, decoded for egui.
png = "0.18"
# The projects file (`studio/projects.toml`) is TOML the user can edit.
toml = "0.9"
craft-ui = { workspace = true }
filmcraft-time = { workspace = true }
filmcraft-geom = { workspace = true }
filmcraft-color = { workspace = true }
filmcraft-frame = { workspace = true }
filmcraft-media = { workspace = true }
filmcraft-project = { workspace = true }
filmcraft-tts = { workspace = true }
filmcraft-edit = { workspace = true }
filmcraft-render = { workspace = true }
filmcraft-text = { workspace = true }
filmcraft-captions = { workspace = true }
filmcraft-audio-dsp = { workspace = true }
filmcraft-engine = { workspace = true }
filmcraft-export = { workspace = true }
filmcraft-gpu = { workspace = true }
filmcraft-scopes = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "clipboard"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
web-time = "1"
# Unicode Bidirectional Algorithm for Arabic and Hebrew captions in reading order (MIT OR Apache-2.0).
unicode-bidi = "0.3.18"
# ArtCraft wordmark (PNG) for the Home screen.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Reaction 的 AI 设置/模型下载:请求与 ModelScope 下载器都在这个 crate
# (自 opencut 的原生网关移植),界面线程只消费它的事件
ai-gateway = { path = "../ai-gateway" }

# Thread/process CPU clocks for frame-job profiling (safe wrappers; see frames.rs).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }
# the same clocks on Windows (GetThreadTimes / GetProcessTimes behind a safe API; MIT OR Apache-2.0)
[target.'cfg(windows)'.dependencies]
cpu-time = "1"

[dev-dependencies]
pollster = "1"
filmcraft-codecs = { workspace = true }
# the bench registers OS hardware decoders as the desktop app does (dev-dependency only: ui-egui
# itself stays OS-independent and web-portable)
filmcraft-platform = { workspace = true }
filmcraft-interchange = { workspace = true }
# A dependency's dev-dependencies do not propagate through egui_kittest: name the fonts this
# test root needs explicitly so glyph and accessibility assertions run against the bundled faces.
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }
tempfile = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-update = { workspace = true }
